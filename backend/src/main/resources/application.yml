spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/servicehub?createDatabaseIfNotExist=true}
    username: ${DB_USER:servicehub}
    password: ${DB_PASSWORD:servicehub}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  jackson.default-property-inclusion: non_null
server.servlet.context-path: /
app.jwt.secret: ${JWT_SECRET:replace-this-with-a-long-32-character-servicehub-secret-key}
